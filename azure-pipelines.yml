trigger:
  - dev

pool:
  name: Default  # Ensure this is your self-hosted agent pool name

variables:
  imageName: spring-boot-app
  registry: seahmedadel
  projectKey: spring-boot-k8s-deployment_spring-boot-k8s-deployment_53566949-f2a3-4a9a-86fd-78431460c341
  sonarHost: http://96.126.101.247:9000
  sonarToken: $(SONAR_TOKEN)  # Make sure to add SONAR_TOKEN as a secret variable in the pipeline's variables

stages:
  - stage: Lint
    jobs:
    - job: Lint
      steps:
        - script: |
            echo "Listing files in the checkstyle directory..."
            ls -l $(Build.SourcesDirectory)/config/checkstyle/
            cat $(Build.SourcesDirectory)/config/checkstyle/checkstyle.xml
          displayName: "Verify Checkstyle Config File"
        - script: |
            echo "Linting code..."
            chmod +x gradlew  # Ensure gradlew is executable
            ./gradlew check
          displayName: "Lint Code"
          workingDirectory: $(Build.SourcesDirectory)  # Ensure the pipeline runs in the correct directory

  

  - stage: UnitTest
    jobs:
      - job: UnitTest
        steps:
          - script: |
              echo "Running Unit Tests..."
              chmod +x gradlew  # Ensure gradlew is executable on the agent
              ./gradlew test
            displayName: Run Unit Tests
            workingDirectory: $(Build.SourcesDirectory)

  - stage: SonarQube
    jobs:
      - job: SonarQube
        steps:
          - task: SonarQubePrepare@5
            inputs:
              SonarQube: 'SonarQube'  # Make sure this matches your SonarQube connection in Azure DevOps
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: $(projectKey)
              cliOptions: |
                -Dsonar.projectKey=$(projectKey)
                -Dsonar.host.url=$(sonarHost)
                -Dsonar.login=$(sonarToken)
          - script: |
              chmod +x gradlew  # Ensure gradlew is executable on the agent
              ./gradlew sonar
            displayName: Run SonarQube Analysis
            workingDirectory: $(Build.SourcesDirectory)

  - stage: BuildImage
    jobs:
      - job: BuildImage
        steps:
          - script: |
              docker build -t $(registry)/$(imageName):$(Build.BuildId) .
            displayName: Build Docker Image
            workingDirectory: $(Build.SourcesDirectory)

  - stage: PushImage
    jobs:
      - job: PushImage
        steps:
          # Login to Docker Hub
          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              containerRegistry: 'DOCKER_HUB'
              username: $(registry)
              password: $(DOCKER_PASSWORD)

          # Push the Docker image to the registry
          - script: |
              docker push docker.io/seahmedadel/spring-boot-app:$(Build.BuildId)
            displayName: 'Push Image to Registry'
            workingDirectory: $(Build.SourcesDirectory)


  - stage: PullImage
    jobs:
      - job: PullImage
        steps:
          - script: |
              echo "Pulling Docker Image from Registry..."
              docker pull docker.io/seahmedadel/spring-boot-app:$(Build.BuildId)
            displayName: 'Pull Image from Registry'

  - stage: Deploy
    jobs:
      - job: Deploy
        steps:
          # Download kubeconfig (replace this step if using secure storage)
          - task: DownloadSecureFile@1
            inputs:
              secureFile: 'kubeconfig'
            displayName: 'Download kubeconfig file'

          # Configure kubeconfig for kubectl
          - script: |
              mkdir -p ~/.kube
              mv $(Agent.TempDirectory)/kubeconfig ~/.kube/config
            displayName: 'Configure kubeconfig'

          # Test kubectl connectivity
          - script: |
              kubectl get nodes
            displayName: 'Verify Kubernetes Authentication'

          # Deploy Kubernetes manifests
          - script: |
              kubectl apply -f deployment/deployment.yml
              kubectl apply -f deployment/service.yml
              kubectl apply -f deployment/ingress.yml
            displayName: 'Deploy to Kubernetes'
